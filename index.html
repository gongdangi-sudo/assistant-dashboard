<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공단기 부담임 대시보드</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f6fa;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",Arial,sans-serif}
    .hidden{display:none!important}
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .login-card{width:100%;max-width:420px;background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:25px}.sub{color:#777;font-size:13px;margin-bottom:24px}
    label{display:block;margin:14px 0 7px;font-size:13px;font-weight:800}
    input,select{width:100%;height:48px;padding:0 13px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit}
    button{border:0;border-radius:12px;font-weight:900;cursor:pointer}
    .primary{width:100%;height:50px;margin-top:18px;background:#6a3fc8;color:#fff}
    .message{margin-top:12px;padding:11px;border-radius:10px;background:#fff0f0;color:#c62828;font-size:12px;display:none}
    .header{padding:24px 18px 34px;background:#6a3fc8;color:#fff}
    .header-inner{max-width:950px;margin:0 auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .header h1{font-size:23px}.header p{margin:6px 0 0;font-size:12px;opacity:.9}
    .logout{height:36px;padding:0 12px;background:rgba(255,255,255,.16);color:#fff}
    .content{width:100%;max-width:950px;margin:-16px auto 0;padding:0 14px 30px}
    .card{background:#fff;border-radius:18px;padding:17px;margin-bottom:13px;box-shadow:0 7px 20px rgba(0,0,0,.06)}
    .card-title{font-size:15px;font-weight:900;margin-bottom:12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .student-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:430px;overflow-y:auto}
    .student-btn{padding:12px;text-align:left;background:#f7f8fb;border:1px solid #eceef2;color:#222}
    .student-btn.active{border-color:#6a3fc8;background:#f3efff}
    .student-name{font-size:14px;font-weight:900}.student-meta{margin-top:4px;color:#777;font-size:10px}
    .empty{padding:18px;text-align:center;color:#999;font-size:12px}
    .proposal{border:1px solid #eceef2;border-radius:13px;padding:12px;margin-bottom:8px}
    .proposal-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .proposal-name{font-size:13px;font-weight:900}.proposal-meta{margin-top:4px;color:#777;font-size:10px}
    .status{padding:4px 8px;border-radius:999px;background:#f2f3f5;font-size:9px;font-weight:900;white-space:nowrap}
    .status.accept{background:#edf8ef;color:#2e7d32}.status.reject{background:#fff0f0;color:#c62828}
    .status.change{background:#eef4ff;color:#315ca8}
    .change-box{margin-top:8px;padding:9px;border-radius:9px;background:#fff7e8;font-size:10px;line-height:1.5}
    .change-actions{display:flex;gap:6px;margin-top:7px}
    .change-actions button{border:0;border-radius:8px;padding:7px 10px;font-weight:900;cursor:pointer}
    .change-approve{background:#edf8ef;color:#25733a}.change-reject{background:#fff0f0;color:#b42318}
    .complete{margin-top:9px;height:34px;padding:0 11px;background:#222;color:#fff}
    .search{margin-bottom:10px}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.student-list{grid-template-columns:1fr}}
  </style>
</head>
<body>

<section id="loginView" class="login-wrap">
  <div class="login-card">
    <h1>부담임 대시보드</h1>
    <div class="sub">계정 시트에 등록된 부담임 계정으로 로그인해주세요.</div>
    <label for="adminId">아이디</label>
    <input id="adminId" autocomplete="username">
    <label for="password">비밀번호</label>
    <input id="password" type="password" autocomplete="current-password">
    <button class="primary" id="loginBtn">로그인</button>
    <div id="loginMessage" class="message"></div>
  </div>
</section>

<section id="dashboardView" class="hidden">
  <header class="header">
    <div class="header-inner">
      <div>
        <h1 id="assistantGreeting">부담임 대시보드</h1>
        <p>담당 학생 상담 일정을 제안하고 응답 상태를 확인할 수 있습니다.</p>
      </div>
      <button class="logout" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <main class="content">
    <div class="grid">
      <section class="card">
        <div class="card-title">👥 내 담당 학생</div>
        <input id="studentSearch" class="search" placeholder="학생명 / 강의실 / 좌석 검색">
        <div id="studentList" class="student-list">
          <div class="empty">학생 정보를 불러오는 중입니다.</div>
        </div>
      </section>

      <section class="card">
        <div class="card-title">📅 상담 일정 제안</div>
        <div id="selectedStudentText" class="empty">왼쪽에서 학생을 선택해주세요.</div>

        <div id="proposalForm" class="hidden">
          <label for="proposedDate">상담 날짜</label>
          <input id="proposedDate" type="date">

          <label for="proposedTime">상담 시간</label>
          <select id="proposedTime">
            <option value="">시간 선택</option>
            <option>10:00</option><option>10:30</option>
            <option>11:00</option><option>11:30</option>
            <option>12:00</option><option>12:30</option>
            <option>13:00</option><option>13:30</option>
            <option>14:00</option><option>14:30</option>
            <option>15:00</option><option>15:30</option>
            <option>16:00</option>
          </select>

          <button class="primary" id="sendProposalBtn">학생에게 일정 보내기</button>
        </div>
      </section>
    </div>

    <section class="card">
      <div class="card-title">🗂 상담 일정 현황</div>
      <div id="counselingList">
        <div class="empty">상담 일정을 불러오는 중입니다.</div>
      </div>
    </section>
  </main>
</section>

<script>
const API_URL =
  "https://script.google.com/macros/s/AKfycbzO4iggKXHjrldh8Mf75vtoy6xQwoZBS9niwCgWbgCFUrSQNahw98G94BlDsYDrUtr2ow/exec";

let sessionToken = "";
let currentUser = null;
let students = [];
let selectedStudent = null;

function api(action, params){
  return new Promise((resolve,reject)=>{
    const callbackName =
      "__assistantCallback_" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2,8);

    const script = document.createElement("script");

    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("서버 응답 시간이 초과되었습니다."));
    },10000);

    function cleanup(){
      clearTimeout(timeout);
      try{ delete window[callbackName]; }catch(e){}
      if(script.parentNode){ script.parentNode.removeChild(script); }
    }

    window[callbackName] = function(result){
      cleanup();
      resolve(result);
    };

    const query = new URLSearchParams(
      Object.assign({}, params || {}, {
        action: action,
        callback: callbackName,
        _: String(Date.now())
      })
    );

    script.onerror = function(){
      cleanup();
      reject(new Error("서버에 연결할 수 없습니다."));
    };

    script.src = API_URL + "?" + query.toString();
    document.body.appendChild(script);
  });
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e=>{
  if(e.key === "Enter") login();
});
document.getElementById("logoutBtn").addEventListener("click", logout);
document.getElementById("studentSearch").addEventListener("input", renderStudents);
document.getElementById("sendProposalBtn").addEventListener("click", sendProposal);

async function login(){
  const adminId = document.getElementById("adminId").value.trim();
  const password = document.getElementById("password").value.trim();

  showLoginMessage("");

  try{
    const result = await api("assistantLogin", {adminId,password});

    if(!result || !result.success){
      showLoginMessage(
        result && result.message ? result.message : "로그인에 실패했습니다."
      );
      return;
    }

    sessionToken = result.sessionToken;
    currentUser = result.user || {};

    sessionStorage.setItem("assistantPortalSession",sessionToken);

    openDashboard();
  }catch(error){
    showLoginMessage(error.message || "로그인 중 오류가 발생했습니다.");
  }
}

function openDashboard(){
  document.getElementById("loginView").classList.add("hidden");
  document.getElementById("dashboardView").classList.remove("hidden");

  document.getElementById("assistantGreeting").textContent =
    (currentUser && currentUser.name
      ? currentUser.name + " 부담임"
      : "부담임") +
    " 대시보드";

  loadStudents();
  loadCounseling();
}

function logout(){
  sessionStorage.removeItem("assistantPortalSession");
  sessionToken = "";
  currentUser = null;
  students = [];
  selectedStudent = null;

  document.getElementById("dashboardView").classList.add("hidden");
  document.getElementById("loginView").classList.remove("hidden");
}

async function loadStudents(){
  const box = document.getElementById("studentList");
  box.innerHTML = '<div class="empty">학생 정보를 불러오는 중입니다.</div>';

  try{
    const result = await api("assistantStudents",{sessionToken});

    if(!result || !result.success){
      box.innerHTML =
        '<div class="empty">' +
        esc(result && result.message ? result.message : "학생 정보를 불러오지 못했습니다.") +
        '</div>';
      return;
    }

    currentUser = result.user || currentUser;
    students = Array.isArray(result.rows) ? result.rows : [];
    renderStudents();
  }catch(error){
    box.innerHTML =
      '<div class="empty">' +
      esc(error.message || "학생 정보를 불러오지 못했습니다.") +
      '</div>';
  }
}

function renderStudents(){
  const box = document.getElementById("studentList");
  const q = document.getElementById("studentSearch").value.trim().toLowerCase();

  const filtered = students.filter(s=>{
    const text = [s.name,s.classroom,s.seat,s.studentId].join(" ").toLowerCase();
    return !q || text.indexOf(q) !== -1;
  });

  if(!filtered.length){
    box.innerHTML = '<div class="empty">표시할 담당 학생이 없습니다.</div>';
    return;
  }

  box.innerHTML = "";

  filtered.forEach(student=>{
    const btn = document.createElement("button");
    btn.className =
      "student-btn" +
      (selectedStudent && selectedStudent.studentId === student.studentId
        ? " active"
        : "");

    btn.innerHTML =
      '<div class="student-name">' + esc(student.name) + '</div>' +
      '<div class="student-meta">' +
      esc(student.classroom || "-") + " · " +
      esc(student.seat || "-") + "번</div>";

    btn.addEventListener("click", ()=>{
      selectedStudent = student;
      renderStudents();
      showProposalForm();
    });

    box.appendChild(btn);
  });
}

function showProposalForm(){
  if(!selectedStudent) return;

  document.getElementById("selectedStudentText").classList.remove("empty");
  document.getElementById("selectedStudentText").innerHTML =
    "<strong>" + esc(selectedStudent.name) + "</strong><br>" +
    '<span style="font-size:11px;color:#777;">' +
    esc(selectedStudent.classroom || "-") + " · " +
    esc(selectedStudent.seat || "-") + "번</span>";

  document.getElementById("proposalForm").classList.remove("hidden");
}

async function sendProposal(){
  if(!selectedStudent){
    alert("학생을 선택해주세요.");
    return;
  }

  const proposedDate = document.getElementById("proposedDate").value;
  const proposedTime = document.getElementById("proposedTime").value;

  if(!proposedDate || !proposedTime){
    alert("상담 날짜와 시간을 선택해주세요.");
    return;
  }

  const btn = document.getElementById("sendProposalBtn");
  btn.disabled = true;
  btn.textContent = "전송 중...";

  try{
    const result = await api("assistantCounselingPropose",{
      sessionToken,
      studentId:selectedStudent.studentId,
      proposedDate,
      proposedTime
    });

    if(!result || !result.success){
      alert(result && result.message ? result.message : "일정 전송에 실패했습니다.");
      return;
    }

    alert("상담 일정을 전송했습니다.");
    document.getElementById("proposedDate").value = "";
    document.getElementById("proposedTime").value = "";
    loadCounseling();

  }catch(error){
    alert(error.message || "일정 전송 중 오류가 발생했습니다.");
  }finally{
    btn.disabled = false;
    btn.textContent = "학생에게 일정 보내기";
  }
}

async function loadCounseling(){
  const box = document.getElementById("counselingList");
  box.innerHTML = '<div class="empty">상담 일정을 불러오는 중입니다.</div>';

  try{
    const result = await api("assistantCounselingList",{sessionToken});

    if(!result || !result.success){
      box.innerHTML =
        '<div class="empty">' +
        esc(result && result.message ? result.message : "일정을 불러오지 못했습니다.") +
        '</div>';
      return;
    }

    const rows = Array.isArray(result.rows) ? result.rows : [];

    if(!rows.length){
      box.innerHTML = '<div class="empty">등록된 상담 일정이 없습니다.</div>';
      return;
    }

    box.innerHTML = "";

    rows.forEach(item=>{
      const div = document.createElement("div");
      div.className = "proposal";

      let statusClass = "";
      if(item.status === "참석" || item.status === "변경승인") statusClass = " accept";
      if(item.status === "미참석" || item.status === "참여비희망" || item.status === "변경반려") statusClass = " reject";
      if(item.status === "일정변경요청") statusClass = " change";

      let extra = "";
      if((item.status === "미참석" || item.status === "참여비희망") && item.rejectionReason){
        extra =
          '<div class="proposal-meta" style="color:#c62828;">사유: ' +
          esc(item.rejectionReason) +
          '</div>';
      }

      if(item.status === "일정변경요청"){
        extra +=
          '<div class="change-box"><strong>학생 일정 변경 요청</strong><br>' +
          esc(item.requestedDate || "-") + " " + esc(item.requestedTime || "") +
          (item.changeReason ? '<br>사유: ' + esc(item.changeReason) : '') +
          '<div class="change-actions">' +
            '<button class="change-approve" data-change-approve="' + esc(item.applicationId) + '">승인</button>' +
            '<button class="change-reject" data-change-reject="' + esc(item.applicationId) + '">반려</button>' +
          '</div></div>';
      }

      let completeButton = "";
      if(item.status === "참석" || item.status === "변경승인"){
        completeButton =
          '<button class="complete" data-complete="' +
          esc(item.applicationId) +
          '">상담 완료</button>';
      }

      div.innerHTML =
        '<div class="proposal-top">' +
          '<div>' +
            '<div class="proposal-name">' + esc(item.studentName) + '</div>' +
            '<div class="proposal-meta">' +
              esc(item.proposedDate) + " · " +
              esc(item.proposedTime) + " · " +
              esc(item.classroom || "-") + " " +
              esc(item.seat || "-") + "번" +
            '</div>' +
            extra +
          '</div>' +
          '<span class="status' + statusClass + '">' +
            esc(item.status || "제안") +
          '</span>' +
        '</div>' +
        completeButton;

      box.appendChild(div);
    });

    box.querySelectorAll("[data-complete]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        completeCounseling(btn.dataset.complete);
      });
    });

    box.querySelectorAll("[data-change-approve]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        decideChange(btn.dataset.changeApprove, "승인");
      });
    });

    box.querySelectorAll("[data-change-reject]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        decideChange(btn.dataset.changeReject, "반려");
      });
    });

  }catch(error){
    box.innerHTML =
      '<div class="empty">' +
      esc(error.message || "일정을 불러오지 못했습니다.") +
      '</div>';
  }
}

async function decideChange(applicationId, decision){
  if(!confirm("일정 변경 요청을 " + decision + "할까요?")) return;

  try{
    const result = await api("assistantCounselingChangeDecision",{
      sessionToken,
      applicationId,
      decision
    });

    if(!result || !result.success){
      alert(result && result.message ? result.message : "처리에 실패했습니다.");
      return;
    }

    alert(result.message || "처리되었습니다.");
    loadCounseling();
  }catch(error){
    alert(error.message || "처리 중 오류가 발생했습니다.");
  }
}

async function completeCounseling(applicationId){
  if(!confirm("이 상담을 완료 처리할까요?")) return;

  try{
    const result = await api("assistantCounselingComplete",{
      sessionToken,
      applicationId
    });

    if(!result || !result.success){
      alert(result && result.message ? result.message : "완료 처리에 실패했습니다.");
      return;
    }

    loadCounseling();

  }catch(error){
    alert(error.message || "완료 처리 중 오류가 발생했습니다.");
  }
}

function showLoginMessage(text){
  const box = document.getElementById("loginMessage");

  if(!text){
    box.style.display = "none";
    box.textContent = "";
    return;
  }

  box.style.display = "block";
  box.textContent = text;
}

function esc(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
